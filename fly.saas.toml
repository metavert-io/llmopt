app = "llmopt"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile.saas"

[env]
  # LLM Optimizer
  LLMOPT_SAAS_ENABLED = "true"
  STATIC_DIR = "/app/static"
  LLMOPT_FRONTEND_DIR = "/app/saas-frontend"
  DATABASE_NAME = "llmopt"
  # LastSaaS
  LASTSAAS_ENV = "prod"
  LASTSAAS_CONFIG_DIR = "/app/lastsaas-config"
  FRONTEND_STATIC_DIR = "/dev/null"
  SERVER_PORT = "8091"
  FRONTEND_URL = "https://llmopt.metavert.io"
  APP_NAME = "LLM Optimizer"
  # Idle shutdown (backend/idle.go): the machine stops itself after 60 minutes
  # without signed-in activity (10 minutes for anonymous visits), never during a
  # request. Fly's own auto-stop is off below because it stops an idle machine
  # after a few minutes, which could happen mid-way through working on a report.
  LLMOPT_IDLE_SHUTDOWN = "60m"
  LLMOPT_IDLE_SHUTDOWN_VISITOR = "10m"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # the app stops itself when idle (LLMOPT_IDLE_SHUTDOWN)
  auto_start_machines = true   # and the proxy starts it on the next request
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2

# A clean exit (the idle shutdown) must leave the machine stopped; only crashes
# are restarted. The proxy starts a stopped machine on the next request.
[[restart]]
  policy = "on-failure"
  retries = 10
  processes = ["app"]
